server {
    listen 80;
    server_name _;

    # Telegram Mini App frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Python API backend.
    # Upstream через переменную + docker DNS (127.0.0.11): nginx резолвит api
    # заново на каждый запрос. Иначе имя резолвится один раз при старте, и
    # после пересоздания контейнера api (docker compose build api) nginx
    # стучится в старый IP и отдаёт 502.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (AI-ассистент): без отключения буферизации deltas придут одним
        # куском в конце; таймаут 60s убивал стрим в длинном цикле инструментов
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
