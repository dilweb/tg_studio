<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TG Studio — Вход</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:var(--tg-theme-bg-color,#1a1a2e);--text:var(--tg-theme-text-color,#e0e0e0);--hint:var(--tg-theme-hint-color,#888);--link:var(--tg-theme-link-color,#6c63ff);--btn:var(--tg-theme-button-color,#6c63ff);--btn-text:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#16213e);--danger:#ff4757;--success:#2ed573;--border:#2a2a4a;--radius:12px}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
        .hidden{display:none!important}
        .container{max-width:480px;margin:0 auto}
        .screen-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
        .screen-header h1{font-size:20px;font-weight:600}
        .screen-header .subtitle{font-size:13px;color:var(--hint)}
        .btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;text-align:center;transition:opacity .15s}
        .btn:active{opacity:.7}
        .btn-primary{background:var(--btn);color:var(--btn-text)}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-ghost{background:none;border:1px solid var(--border);color:var(--hint);padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer}
        .btn-group{display:flex;gap:8px;margin-top:12px}
        .btn-group .btn{flex:1}
        .login-box{background:var(--card);border-radius:20px;padding:32px 24px;margin-top:40px;border:1px solid var(--border)}
        .login-box h2{text-align:center;margin-bottom:8px;font-size:22px}
        .login-box .subtitle{text-align:center;color:var(--hint);font-size:14px;margin-bottom:24px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:13px;color:var(--hint);margin-bottom:6px;font-weight:500}
        .form-group input,.form-group select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
        .form-group input:focus,.form-group select:focus{border-color:var(--link)}
        .error{color:var(--danger);font-size:13px;margin-top:8px;text-align:center}
        .project-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--border);cursor:pointer;transition:transform .1s}
        .project-card:active{transform:scale(.98)}
        .project-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
        .project-card .cost{font-size:18px;font-weight:700;color:var(--btn);white-space:nowrap}
        .project-card .meta{font-size:13px;color:var(--hint);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
        .project-card .meta span{background:rgba(108,99,255,.1);padding:2px 8px;border-radius:6px}
        .project-card .date{font-size:13px;color:var(--link);margin-top:8px}
        .status-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;margin-left:6px}
        .status-planned{background:rgba(108,99,255,.2);color:var(--link)}
        .status-in_progress{background:rgba(46,213,115,.2);color:var(--success)}
        .status-completed{background:rgba(255,255,255,.1);color:var(--hint)}
        .status-cancelled{background:rgba(255,71,87,.2);color:var(--danger)}
        .empty-state{text-align:center;padding:48px 20px;color:var(--hint)}
        .empty-state .icon{font-size:48px;margin-bottom:12px}
        .empty-state strong{display:block;font-size:16px;margin-bottom:4px}
        .fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--btn-text);border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(108,99,255,.4);display:flex;align-items:center;justify-content:center;z-index:100}
        .fab:active{transform:scale(.9)}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
        .modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-header h2{font-size:18px;margin:0}
        .modal-close{background:none;border:none;color:var(--hint);font-size:24px;cursor:pointer;padding:4px;line-height:1}
        .spinner{text-align:center;padding:20px;color:var(--hint)}
    </style>
</head>
<body>
    <div class="container">
        <div id="screen-login"></div>
        <div id="screen-dashboard" class="hidden"></div>
    </div>
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal" id="modal-content"></div>
    </div>

    <script>
    // ===== TG Studio Master App =====
    const API_BASE = window.location.origin;
    const STORAGE_KEY = 'tg_master_token';

    let tg = null;
    try { tg = window.Telegram?.WebApp; if (tg) tg.expand(); } catch(e) {}

    // --- State ---
    const appState = {
        token: localStorage.getItem(STORAGE_KEY) || '',
        master: null,
        projects: [],
    };
    function isAuth() { return !!appState.token; }
    function setAuth(token, master) { appState.token = token; appState.master = master; localStorage.setItem(STORAGE_KEY, token); }
    function resetAuth() { appState.token = ''; appState.master = null; appState.projects = []; localStorage.removeItem(STORAGE_KEY); }
    function getState() { return appState; }

    // --- API ---
    async function api(path, opts = {}) {
        const headers = { ...opts.headers };
        const t = appState.token;
        if (t) headers['Authorization'] = 'Bearer ' + t;
        if (!opts.body || typeof opts.body === 'string') headers['Content-Type'] = 'application/json';
        const res = await fetch(API_BASE + '/api/tattoo' + path, { ...opts, headers });
        if (res.status === 401) { resetAuth(); showLogin(); return null; }
        if (res.status === 204) return null;
        const d = await res.json();
        if (!res.ok) throw new Error(d.detail || 'Ошибка ' + res.status);
        return d;
    }

    // --- Screens ---
    const el = (id) => document.getElementById(id);
    const loginScreen = el('screen-login');
    const dashScreen = el('screen-dashboard');
    const modalOverlay = el('modal-overlay');
    const modalContent = el('modal-content');

    function showLogin() {
        dashScreen.classList.add('hidden');
        loginScreen.innerHTML = `
            <div class="login-box">
                <h2>🔐 TG Studio</h2>
                <p class="subtitle">Вход для мастера</p>
                <div class="form-group">
                    <label>Telegram ID мастера</label>
                    <input type="text" id="log-id" inputmode="numeric" placeholder="Ваш Telegram ID" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="log-pass" placeholder="Пароль" autocomplete="off">
                </div>
                <button class="btn btn-primary" id="log-btn">Войти</button>
                <div id="log-err" class="error"></div>
            </div>`;
        loginScreen.classList.remove('hidden');
        el('log-btn').onclick = handleLogin;
        el('log-pass').onkeydown = (e) => { if (e.key === 'Enter') handleLogin(); };
    }

    async function handleLogin() {
        const id = el('log-id').value.trim().replace(/[,\s]/g, '');
        const pass = el('log-pass').value.trim();
        if (!id || !pass) { el('log-err').textContent = 'Заполните все поля'; return; }
        const numId = parseInt(id, 10);
        if (isNaN(numId)) { el('log-err').textContent = 'ID должен быть числом'; return; }
        try {
            const res = await fetch(API_BASE + '/api/tattoo/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ master_id: numId, password: pass }),
            });
            const data = await res.json();
            if (!res.ok) { el('log-err').textContent = data.detail || 'Ошибка ' + res.status; return; }
            setAuth(data.access_token, data);
            showDashboard();
        } catch(e) { el('log-err').textContent = e.message || 'Ошибка соединения'; }
    }

    const STATUS = { planned: 'Запланирован', in_progress: 'В работе', completed: 'Завершён', cancelled: 'Отменён' };

    function showDashboard() {
        loginScreen.classList.add('hidden');
        const m = getState().master;
        dashScreen.innerHTML = `
            <div class="screen-header">
                <div>
                    <h1>📋 Проекты</h1>
                    <div class="subtitle">${m ? m.master_name : 'Мастер'}</div>
                </div>
                <button class="btn-ghost" id="logout-btn">Выйти</button>
            </div>
            <div id="proj-list"></div>
            <button class="fab" id="fab-add">+</button>`;
        dashScreen.classList.remove('hidden');
        el('logout-btn').onclick = () => { resetAuth(); showLogin(); };
        el('fab-add').onclick = () => showModal('create');
        loadProjects();
    }

    async function loadProjects() {
        const list = el('proj-list');
        list.innerHTML = '<div class="spinner">Загрузка...</div>';
        try {
            const d = await api('/projects');
            if (!d) return;
            appState.projects = d.projects || [];
            renderProjects(d.projects || []);
        } catch(e) { list.innerHTML = '<div class="error">' + e.message + '</div>'; }
    }

    function renderProjects(projs) {
        const list = el('proj-list');
        if (!projs.length) {
            list.innerHTML = '<div class="empty-state"><div class="icon">📝</div><strong>Нет проектов</strong><p>Нажмите + чтобы создать</p></div>';
            return;
        }
        list.innerHTML = projs.map(p => `
            <div class="project-card" data-id="${p.id}">
                <div class="top">
                    <div><strong>${esc(p.placement)}</strong><span class="status-badge status-${p.status}">${STATUS[p.status]||p.status}</span></div>
                    <div class="cost">${Number(p.cost).toLocaleString()} ₸</div>
                </div>
                <div class="meta"><span>📏 ${esc(p.size)}</span><span>🔧 ${esc(p.complexity)}</span></div>
                <div class="date">📅 ${fmtDate(p.session_date)}</div>
            </div>`).join('');
        list.querySelectorAll('.project-card').forEach(c => {
            c.onclick = () => {
                const p = appState.projects.find(x => x.id === parseInt(c.dataset.id,10));
                if (p) showModal('edit', p);
            };
        });
    }

    function fmtDate(iso) { return new Date(iso).toLocaleString('ru-RU', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // --- Modal ---
    let editId = null;

    function showModal(mode, proj) {
        const isEdit = mode === 'edit';
        editId = isEdit ? proj.id : null;
        const sd = isEdit ? toLocal(proj.session_date) : defaultDate();
        modalContent.innerHTML = `
            <div class="modal-header">
                <h2>${isEdit ? '✏️ Редактировать' : '✏️ Новый проект'}</h2>
                <button class="modal-close" id="modal-x">✕</button>
            </div>
            <div class="form-group"><label>Размер</label>
                <select id="f-sz">
                    <option value="маленький" ${isEdit&&proj.size==='маленький'?'selected':''}>Маленький</option>
                    <option value="средний" ${isEdit&&proj.size==='средний'?'selected':''}>Средний</option>
                    <option value="большой" ${isEdit&&proj.size==='большой'?'selected':''}>Большой</option>
                </select>
            </div>
            <div class="form-group"><label>Сложность</label>
                <select id="f-cx">
                    <option value="низкая" ${isEdit&&proj.complexity==='низкая'?'selected':''}>Низкая</option>
                    <option value="средняя" ${isEdit&&proj.complexity==='средняя'?'selected':''}>Средняя</option>
                    <option value="высокая" ${isEdit&&proj.complexity==='высокая'?'selected':''}>Высокая</option>
                </select>
            </div>
            <div class="form-group"><label>Место нанесения</label>
                <input type="text" id="f-pl" value="${isEdit?esc(proj.placement):''}" placeholder="Например: левое предплечье">
            </div>
            <div class="form-group"><label>Дата и время сеанса</label>
                <input type="datetime-local" id="f-dt" value="${sd}">
            </div>
            <div class="form-group"><label>Стоимость (₸)</label>
                <input type="number" id="f-cost" value="${isEdit?proj.cost:''}" placeholder="0" min="0">
            </div>
            <div id="modal-err" class="error"></div>
            <div class="btn-group">
                <button class="btn btn-primary" id="modal-submit">${isEdit?'Сохранить':'Создать'}</button>
                ${isEdit?'<button class="btn btn-danger" id="modal-del">Удалить</button>':''}
            </div>`;
        modalOverlay.classList.remove('hidden');
        el('modal-x').onclick = closeModal;
        modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };
        el('modal-submit').onclick = () => { if (isEdit) updateProj(proj.id); else createProj(); };
        if (isEdit) el('modal-del').onclick = () => deleteProj(proj.id);
    }

    function closeModal() { modalOverlay.classList.add('hidden'); editId = null; }

    function getForm() {
        const pl = el('f-pl').value.trim();
        const cost = parseFloat(el('f-cost').value);
        const dt = el('f-dt').value;
        if (!pl) throw new Error('Укажите место нанесения');
        if (!cost || cost <= 0) throw new Error('Укажите корректную стоимость');
        if (!dt) throw new Error('Укажите дату сеанса');
        return { size: el('f-sz').value, complexity: el('f-cx').value, placement: pl, session_date: new Date(dt).toISOString(), cost };
    }

    async function createProj() {
        const err = el('modal-err'); err.textContent = '';
        try { const d = getForm(); await api('/projects', { method: 'POST', body: JSON.stringify(d) }); closeModal(); showDashboard(); }
        catch(e) { err.textContent = e.message; }
    }
    async function updateProj(id) {
        const err = el('modal-err'); err.textContent = '';
        try { const d = getForm(); await api('/projects/'+id, { method: 'PATCH', body: JSON.stringify(d) }); closeModal(); showDashboard(); }
        catch(e) { err.textContent = e.message; }
    }
    async function deleteProj(id) {
        if (!confirm('Удалить проект?')) return;
        try { await api('/projects/'+id, { method: 'DELETE' }); closeModal(); showDashboard(); }
        catch(e) { el('modal-err').textContent = e.message; }
    }

    function toLocal(iso) { const d = new Date(iso); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16); }
    function defaultDate() { const d = new Date(); d.setDate(d.getDate()+1); d.setHours(10,0,0,0); return d.toISOString().slice(0,16); }

    // --- Init ---
    if (isAuth()) {
        api('/projects').then(d => { if (d) showDashboard(); else showLogin(); }).catch(() => showLogin());
    } else {
        showLogin();
    }
    </script>
</body>
</html>
