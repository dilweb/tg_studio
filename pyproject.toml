[project]
name = "tg-studio"
version = "0.1.0"
description = "Telegram Mini App для записи на сеанс с оплатой через Kaspi Pay"
authors = [
    {name = "dilweb", email = "yxs.crevier@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.18",
    "fastapi>=0.115",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "sqlalchemy[asyncio] (>=2.0.47,<3.0.0)",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "ruff (>=0.15.8,<0.16.0)",
    "openai>=1.0",
    "pyjwt (>=2.12.1,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=3.2.0,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "google-api-python-client (>=2.199.0,<3.0.0)",
    "google-auth-httplib2 (>=0.4.2,<0.5.0)",
    "google-auth-oauthlib (>=1.4.1,<2.0.0)",
    "ngrok (>=1.7.0,<2.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.15.8",
]

[tool.poetry]
packages = [{include = "tg_studio", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-ignore = [
    "E501",
    "B008",
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["tg_studio"]

[dependency-groups]
dev = [
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.15.8,<0.16.0)"
]
