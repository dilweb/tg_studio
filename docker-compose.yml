services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "6005:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tg_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-tg_studio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tg_studio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-совместимое файловое хранилище: фото сеансов, портфолио, аватары.
  # Оригинальные образы minio/* удалены из Docker Hub и quay (анонимные
  # скачивания закрыты) — используем drop-in форк pgsty/silo (тот же
  # бинарник и env). Веб-консоль (файлы глазами): http://localhost:6006
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tgstudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret}
    ports:
      - "6006:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: uvicorn tg_studio.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tg_studio}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-tg_studio}
      RUN_MIGRATIONS: "true"
    volumes:
      # Ключ сервисного аккаунта Google (читается при POST /connect)
      - ./credentials.json:/app/credentials.json:ro
      # Фото сеансов tattoo-модуля (UPLOAD_DIR): bind mount — папка видна
      # на хосте, на VPS переезжает rsync'ом целиком
      - ./data/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    command: python -m tg_studio.bot.app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tg_studio}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-tg_studio}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A tg_studio.tasks.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tg_studio}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-tg_studio}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    restart: unless-stopped
    command: celery -A tg_studio.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    command: http --url=${NGROK_DOMAIN} --log=stdout nginx:80
    env_file: .env
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  minio_data:
